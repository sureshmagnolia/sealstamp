<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prof. (Dr.) Suresh V. - Official Seal Stamp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,400;1,700&family=Lora:ital,wght@0,500;0,600;0,700;1,600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --stamp-color: #0b2b5e;
      --stamp-font: 'Merriweather', 'PT Serif', 'Libre Baskerville', Georgia, serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 50%, #fdfbf7 0%, #f4eee2 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 24px;
      color: #2c3e50;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      max-width: 900px;
      width: 100%;
    }

    .card {
      background: #ffffff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      border: 1px solid rgba(0, 0, 0, 0.05);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(#0b2b5e 0.6px, transparent 0.6px), 
        radial-gradient(#0b2b5e 0.6px, #ffffff 0.6px);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
      opacity: 0.03;
      pointer-events: none;
    }

    /* THE HIGH-RESOLUTION HTML STAMP COMPONENT */
    .official-stamp {
      display: inline-flex;
      align-items: center;
      gap: 32px;
      padding: 16px 28px;
      color: var(--stamp-color);
      font-family: var(--stamp-font);
      user-select: none;
      transition: transform 0.2s ease;
      position: relative;
      z-index: 1;
    }

    .official-stamp:hover {
      transform: scale(1.015);
    }

    .stamp-logo-wrap {
      flex-shrink: 0;
      width: 160px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stamp-logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 0.5px var(--stamp-color));
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }

    .stamp-details {
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: left;
      line-height: 1.35;
      letter-spacing: -0.01em;
    }

    .stamp-name {
      font-size: 34px;
      font-weight: 900;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .stamp-pen {
      font-size: 25px;
      font-weight: 700;
      margin-bottom: 2px;
      white-space: nowrap;
    }

    .stamp-desig {
      font-size: 25px;
      font-weight: 700;
      margin-bottom: 2px;
      white-space: nowrap;
    }

    .stamp-college {
      font-size: 25px;
      font-weight: 700;
      margin-bottom: 2px;
      white-space: nowrap;
    }

    .stamp-location {
      font-size: 25px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* Actions toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #374151;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn:hover {
      background: #f9fafb;
      border-color: #9ca3af;
      transform: translateY(-1px);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .btn-primary {
      background: #0b2b5e;
      color: #ffffff;
      border-color: #0b2b5e;
    }

    .btn-primary:hover {
      background: #081d3f;
      border-color: #081d3f;
      color: #ffffff;
    }

    .badge {
      font-size: 12px;
      background: rgba(11, 43, 94, 0.08);
      color: #0b2b5e;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
    }

    /* Print optimization */
    @media print {
      body {
        background: transparent;
        padding: 0;
      }
      .card {
        border: none;
        box-shadow: none;
        padding: 0;
      }
      .toolbar, .badge, .title-section {
        display: none !important;
      }
      .official-stamp {
        transform: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="title-section" style="text-align: center;">
      <h1 style="font-size: 26px; font-weight: 700; color: #1e293b; margin-bottom: 6px;">Official Digital Seal Stamp</h1>
      <p style="font-size: 14px; color: #64748b;">Government College Chittur, Palakkad &bull; High Resolution HTML Stamp</p>
    </div>

    <!-- MAIN STAMP CARD -->
    <div class="card" id="stampCard">
      <div class="official-stamp" id="htmlStamp">
        <div class="stamp-logo-wrap">
          <img src="GCC_Logo_transparent.png" alt="Government College Chittur Logo" class="stamp-logo-img" id="stampLogo">
        </div>
        <div class="stamp-details">
          <div class="stamp-name">Prof. (Dr.) Suresh V.</div>
          <div class="stamp-pen">PEN Number: 656830</div>
          <div class="stamp-desig">Professor, Dept. of Botany</div>
          <div class="stamp-college">Govt. College, Chittur,</div>
          <div class="stamp-location">Palakkad - 678104</div>
        </div>
      </div>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="toolbar">
      <a href="index.html" class="btn btn-primary">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
        Open Stamp Studio &amp; Customizer
      </a>
      <button class="btn" onclick="window.print()">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
        Print Stamp (1:1 Scale)
      </button>
      <button class="btn" onclick="copyStampHTML()">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
        Copy HTML &amp; CSS
      </button>
    </div>
  </div>

  <script src="logo_data.js"></script>
  <script>
    // Ensure base64 fallback works if opened from file:// protocol
    window.addEventListener('DOMContentLoaded', () => {
      const logoEl = document.getElementById('stampLogo');
      if (typeof LOGO_BASE64 !== 'undefined' && LOGO_BASE64) {
        logoEl.src = LOGO_BASE64;
      }
    });

    function copyStampHTML() {
      const code = `<div style="display:inline-flex;align-items:center;gap:24px;padding:12px 20px;color:#0b2b5e;font-family:'Merriweather',Georgia,serif;user-select:none;">
  <div style="flex-shrink:0;width:140px;height:140px;">
    <img src="GCC_Logo_transparent.png" alt="Emblem" style="width:100%;height:100%;object-fit:contain;" />
  </div>
  <div style="display:flex;flex-direction:column;line-height:1.35;text-align:left;">
    <div style="font-size:28px;font-weight:900;margin-bottom:4px;letter-spacing:-0.02em;">Prof. (Dr.) Suresh V.</div>
    <div style="font-size:21px;font-weight:700;margin-bottom:2px;">PEN Number: 656830</div>
    <div style="font-size:21px;font-weight:700;margin-bottom:2px;">Professor, Dept. of Botany</div>
    <div style="font-size:21px;font-weight:700;margin-bottom:2px;">Govt. College, Chittur,</div>
    <div style="font-size:21px;font-weight:700;">Palakkad - 678104</div>
  </div>
</div>`;
      navigator.clipboard.writeText(code).then(() => {
        alert('Stamp HTML snippet copied to clipboard!');
      }).catch(err => {
        console.error('Failed to copy', err);
      });
    }
  </script>
</body>
</html>
